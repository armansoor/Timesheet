<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Timesheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Customizing the time input icon for better UI */
    input[type="time"]::-webkit-calendar-picker-indicator { 
      cursor: pointer; 
      opacity: 0.6;
      transition: 0.2s;
    }
    input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8 flex justify-center items-start">

  <main class="w-full max-w-3xl bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-4 md:mt-10">
    
    <header class="bg-slate-900 text-white p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Weekly Timesheet</h1>
        <p class="text-slate-400 text-sm mt-1">Logs calculate automatically</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-6 py-3 text-right w-full md:w-auto">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Total Hours</div>
        <div class="text-3xl font-black text-blue-400" id="weekTotal">0.00</div>
      </div>
    </header>

    <div class="p-6 md:p-8">
      
      <div class="hidden md:grid grid-cols-[80px_1fr_1fr_80px] gap-4 mb-3 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">
        <div>Day</div>
        <div>Clock In</div>
        <div>Clock Out</div>
        <div class="text-right">Daily</div>
      </div>

      <form id="timesheetForm" class="space-y-4 md:space-y-2">
        <div id="timesheetGrid" class="flex flex-col gap-4 md:gap-2"></div>

        <div class="pt-8 mt-4 border-t border-slate-100 flex flex-col-reverse md:flex-row justify-between items-center gap-4">
          <button type="button" onclick="clearSheet()" class="text-sm font-semibold text-slate-400 hover:text-red-500 transition-colors w-full md:w-auto py-2">
            Clear Week
          </button>
          
          <button type="submit" id="saveBtn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
            Save to Database
          </button>
        </div>
      </form>

      <div class="pt-8 mt-6 border-t border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Saved weeks</h2>
          <span id="storageNote" class="text-xs text-amber-600 font-medium"></span>
        </div>
        <div id="historyList" class="space-y-2"></div>
        <p id="historyEmpty" class="text-sm text-slate-400">No saved weeks yet. Fill in your hours and hit Save.</p>
      </div>
    </div>
  </main>

  <script>
    // --- 1. CONFIGURATION ---
    // Paste your Google Apps Script Web App URL here to also sync to Google Sheets.
    // Leave as-is and the app works fully offline, saving weeks in this browser.
    const GOOGLE_WEBAPP_URL = 'YOUR_GOOGLE_SCRIPT_URL_HERE'; // Replace with your URL from Step 1
    const SHEETS_ENABLED = GOOGLE_WEBAPP_URL && !GOOGLE_WEBAPP_URL.includes('YOUR_GOOGLE_SCRIPT_URL_HERE');
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // --- 1b. LOCAL STORAGE ---
    const STORE_KEY = 'timesheet.weeks.v1';
    const loadWeeks = () => {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch { return []; }
    };
    const saveWeeks = weeks => localStorage.setItem(STORE_KEY, JSON.stringify(weeks));
    const weekId = () => {
      const d = new Date();
      const monday = new Date(d);
      monday.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday of this week
      return monday.toISOString().slice(0, 10);
    };
    
    // --- 2. UI GENERATION ---
    const grid = document.getElementById('timesheetGrid');
    days.forEach(day => {
      grid.innerHTML += `
        <div class="bg-slate-50 md:bg-transparent rounded-xl border border-slate-100 md:border-none p-4 md:p-0 flex flex-col md:grid md:grid-cols-[80px_1fr_1fr_80px] gap-3 md:gap-4 items-center transition-colors hover:bg-slate-50 md:rounded-lg md:px-4 md:py-2">
          
          <div class="w-full md:w-auto flex justify-between md:block items-center">
            <span class="font-bold text-slate-700">${day}</span>
            <span class="md:hidden font-black text-blue-600 text-lg" id="${day}-total-mob">-</span>
          </div>
          
          <div class="w-full relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 md:hidden">IN</span>
            <input type="time" id="${day}-in" class="w-full bg-white border border-slate-200 rounded-lg pl-10 md:pl-4 pr-3 py-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-medium time-input shadow-sm">
          </div>
          
          <div class="w-full relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 md:hidden">OUT</span>
            <input type="time" id="${day}-out" class="w-full bg-white border border-slate-200 rounded-lg pl-12 md:pl-4 pr-3 py-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-medium time-input shadow-sm">
          </div>
          
          <div class="hidden md:block text-right font-black text-slate-800" id="${day}-total-desk">-</div>
        </div>
      `;
    });

    // --- 3. MATH & LOGIC ---
    const getMins = timeStr => {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return (h * 60) + m;
    };

    function calculate() {
      let totalMins = 0;
      
      days.forEach(day => {
        const start = document.getElementById(`${day}-in`).value;
        const end = document.getElementById(`${day}-out`).value;
        let dayMins = 0;

        if (start && end) {
          let s = getMins(start), e = getMins(end);
          if (e < s) e += 24 * 60; // Handles overnight shifts seamlessly
          dayMins = e - s;
          totalMins += dayMins;
        }

        const formatted = dayMins > 0 ? (dayMins / 60).toFixed(2) + 'h' : '-';
        document.getElementById(`${day}-total-desk`).innerText = formatted;
        document.getElementById(`${day}-total-mob`).innerText = formatted;
      });

      document.getElementById('weekTotal').innerText = (totalMins / 60).toFixed(2);
    }

    // Attach event listeners to update math automatically
    document.querySelectorAll('.time-input').forEach(input => {
      input.addEventListener('input', calculate);
    });

    function clearSheet() {
      if(confirm('Clear all hours for this week?')) {
        document.querySelectorAll('.time-input').forEach(input => input.value = '');
        calculate();
      }
    }

    // --- 4. SAVE (Google Sheets when configured, always local) ---
    function renderHistory() {
      const weeks = loadWeeks().sort((a, b) => b.id.localeCompare(a.id));
      const list = document.getElementById('historyList');
      const empty = document.getElementById('historyEmpty');
      document.getElementById('storageNote').textContent =
        SHEETS_ENABLED ? 'Syncing to Google Sheets + this browser' : 'Saving locally in this browser';

      if (!weeks.length) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.innerHTML = weeks.map(w => `
        <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-xl px-4 py-3">
          <div>
            <div class="font-bold text-slate-700 text-sm">Week of ${w.id}</div>
            <div class="text-xs text-slate-400">${days.map(d => `${d}: ${w.days[d] || '-'}`).join(' · ')}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-black text-blue-600">${w.total}h</span>
            <button type="button" onclick="deleteWeek('${w.id}')" class="text-xs text-slate-300 hover:text-red-500 font-bold">✕</button>
          </div>
        </div>`).join('');
    }

    function deleteWeek(id) {
      if (!confirm('Delete this saved week?')) return;
      saveWeeks(loadWeeks().filter(w => w.id !== id));
      renderHistory();
    }

    document.getElementById('timesheetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Saving...';
      btn.disabled = true;

      // Build data object
      const dayValues = {};
      days.forEach(day => { dayValues[day] = document.getElementById(`${day}-total-desk`).innerText; });
      const payload = { Total: document.getElementById('weekTotal').innerText, ...dayValues };

      // Always save locally (upsert by week)
      const weeks = loadWeeks().filter(w => w.id !== weekId());
      weeks.push({ id: weekId(), total: payload.Total, days: dayValues, savedAt: new Date().toISOString() });
      saveWeeks(weeks);
      renderHistory();

      // Optionally sync to Google Sheets
      let synced = true;
      if (SHEETS_ENABLED) {
        try {
          await fetch(GOOGLE_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors', // Essential for submitting to Google Apps Script without CORS errors
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          synced = false;
        }
      }

      if (synced) {
        btn.innerHTML = SHEETS_ENABLED ? '✓ Saved Successfully' : '✓ Saved Locally';
        btn.classList.replace('bg-blue-600', 'bg-emerald-500');
        btn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-600');
      } else {
        btn.innerHTML = 'Saved locally · Sheets sync failed';
        btn.classList.replace('bg-blue-600', 'bg-amber-500');
      }

      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('bg-emerald-500', 'bg-amber-500', 'hover:bg-emerald-600');
        btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
        btn.disabled = false;
      }, 3000);
    });

    renderHistory();
  </script>
</body>
</html>
